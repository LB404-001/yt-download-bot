services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  downloader:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DOWNLOAD_DIR: /tmp/downloads
      THUMB_BG_COLOR: black
    tmpfs:
      - /tmp/downloads:size=2g,uid=1000   # временные файлы живут в RAM и не копятся на диске
    volumes:
      - firefox_profile:/firefox:ro

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    depends_on:
      - redis
      - downloader
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}

  browser:
    image: lscr.io/linuxserver/firefox:latest
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - "127.0.0.1:3000:3000"     # веб-интерфейс браузера, только с вашей машины
    volumes:
      - firefox_profile:/config

volumes:
  redis_data:
  firefox_profile: